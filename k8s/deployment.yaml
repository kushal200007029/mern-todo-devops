apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-backend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mern-backend

  template:
    metadata:
      labels:
        app: mern-backend

    spec:
      containers:
      - name: mern-backend

        image: kushaldevopsengg/mern-backend:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        env:
        - name: MONGO_URI
          value: mongodb://mongodb-service:27017/todo
